

services:
  postgres:
    image: postgres:15
    container_name: pgbouncer-practice-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: practice
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro


  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-practice
    ports:
      - "127.0.0.1:6433:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro


volumes:
  postgres_data:
